name: Build Gold Bee

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Telegram service syntax and strategy tests
        run: |
          python -m py_compile telegram-bot/strategy.py telegram-bot/bot.py telegram-bot/test_strategy.py
          cd telegram-bot
          python -m unittest -v test_strategy.py

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gold-Bee-debug
          path: app/build/outputs/apk/debug/app-debug.apk
